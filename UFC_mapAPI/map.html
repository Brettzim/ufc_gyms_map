<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #111; }
  #map { position: absolute; top: 0; bottom: 0; width: 100%; }

  .leaflet-popup-content-wrapper {
    background: #1a1a1a;
    color: #f0f0f0;
    border-radius: 8px;
    box-shadow: 0 2px 16px rgba(0,0,0,.7);
  }
  .leaflet-popup-content {
    font-size: 13px;
    line-height: 1.75;
    margin: 12px 16px;
    min-width: 180px;
    max-width: 280px;
  }
  .leaflet-popup-tip { background: #1a1a1a; }
  .leaflet-popup-close-button { color: #aaa !important; }

  #legend {
    position: absolute;
    bottom: 36px;
    left: 12px;
    z-index: 1000;
    background: rgba(20,20,20,0.9);
    color: #ddd;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 12px;
    line-height: 2.2;
    box-shadow: 0 2px 10px rgba(0,0,0,.5);
    min-width: 190px;
  }
  #legend strong { color: #fff; display: block; margin-bottom: 2px; }
  #legend hr { border: none; border-top: 1px solid #333; margin: 6px 0; }
  .dot {
    display: inline-block; width: 11px; height: 11px;
    border-radius: 50%; margin-right: 7px; vertical-align: middle;
    border: 1.5px solid rgba(255,255,255,0.35);
  }
  .heat-bar {
    display: inline-block;
    width: 80px; height: 8px;
    margin-right: 7px; vertical-align: middle;
    border-radius: 4px;
    background: linear-gradient(to right, #300, #a00, #ff2200);
    opacity: 0.85;
  }
</style>
</head>

ies":{"gym":"Nova Uniao","popup":"<strong>Nova Uniao</strong><br><span style=\"opacity:0.6;font-size:11px\">Rio de Janeiro, Brazil</span><br><br>Ketlen Vieira &mdash; Women's Bantamweight &bull; 4","count":1},"geometry":{"type":"Point","coordinates":[-43.1729,-22.9068]}},{"type":"Feature","properties":{"gym":"Fortis MMA","popup":"<strong>Fortis MMA</strong><br><span style=\"opacity:0.6;font-size:11px\">Dallas, USA</span><br><br>Macy Chiasson &mdash; Women's Bantamweight &bull; 9","count":1},"geometry":{"type":"Point","coordinates":[-96.797,32.7767]}}]};
const COUNTS = {"Myanmar":1,"Brazil":22,"Portugal":1,"Japan":2,"USA":33,"Iraq":1,"Kazakhstan":1,"Mexico":6,"Russia":12,"Georgia":2,"China":3,"Canada":3,"Ecuador":2,"Australia":3,"England":5,"Morocco":1,"Argentina":2,"Armenia":1,"France":3,"New Zealand":2,"Poland":3,"Kyrgyzstan":2,"Ireland":1,"Nigeria":2,"South Africa":1,"Netherlands":1,"Czech Republic":1,"Uzbekistan":1,"Switzerland":1,"Dominican Republic":1,"Moldova":1,"Croatia":1};

const map = L.map('map').setView([25, -30], 2);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// Choropleth — fully filled countries, red intensity by fighter count
const maxCount = Math.max(...Object.values(COUNTS), 1);

function countryColor(name) {
  const n = COUNTS[name] || 0;
  if (!n) return 'transparent';
  // log scale so single-fighter countries are still visible
  const t = Math.log(n + 1) / Math.log(maxCount + 1);
  const r = 255;
  const g = Math.round(220 * (1 - t));
  const b = Math.round(200 * (1 - t));
  return `rgb(${r},${g},${b})`;
}

fetch('https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson')
  .then(r => r.json())
  .then(world => {
    L.geoJSON(world, {
      style: feature => {
        const name  = feature.properties.name;
        const count = COUNTS[name] || 0;
        return {
          fillColor:   countryColor(name),
          fillOpacity: count ? 0.75 : 0,
          color:       count ? 'rgba(255,80,80,0.4)' : 'transparent',
          weight:      count ? 0.8 : 0,
        };
      },
      onEachFeature: (feature, layer) => {
        const name  = feature.properties.name;
        const count = COUNTS[name];
        if (count) {
          layer.bindTooltip(
            `<strong>${name}</strong><br>${count} ranked fighter${count > 1 ? 's' : ''}`,
            { sticky: true, className: 'country-tip' }
          );
        }
      },
    }).addTo(map);

    // Gym pins added after choropleth so they sit on top
    addGymPins();
  });

// Gym pins — rendered on top of choropleth
function addGymPins() {

function markerColor(count) {
  if (count === 1)  return '#4a9eda';
  if (count <= 3)   return '#ff6b35';
  if (count <= 5)   return '#a855f7';
  return '#f59e0b';
}

function markerRadius(count) {
  return Math.min(6 + count * 1.5, 14);
}

GYMS.features.forEach(feature => {
  const props  = feature.properties;
  const [lon, lat] = feature.geometry.coordinates;

  L.circleMarker([lat, lon], {
    radius:      markerRadius(props.count),
    fillColor:   markerColor(props.count),
    color:       'rgba(255,255,255,0.5)',
    weight:      1.5,
    fillOpacity: 0.9,
  })
  .bindPopup(props.popup, { maxWidth: 300 })
  .addTo(map);
});
} // end addGymPins
